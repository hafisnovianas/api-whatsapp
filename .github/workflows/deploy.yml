name: Deploy to Ubuntu Server with PM2

on:
  push:
    branches:
      - main
      - master # Sesuaikan dengan nama branch utama Anda

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # Langkah 2: Transfer file otomatis ke server Ubuntu (bikin folder dan taruh di sana)
      - name: Copy files to Server via SCP
        uses: appleboy/scp-action@v0.1.4
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          # Kita transfer semua file (kecuali yang ada di .gitignore seperti node_modules dan auth_wa)
          source: "."
          target: "~/api-whatsapp"

      # Langkah 3: Eksekusi command di server
      - name: Deploy to Server via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          script: |
            # 1. Pindah ke direktori project yang baru saja dicopy oleh SCP
            cd ~/api-whatsapp
            
            # 2. Install dependensi NPM terbaru
            npm install
            
            # 3. Restart atau Start aplikasi dengan PM2 menggunakan server.js (API Server)
            # Pastikan Anda telah menginstall PM2 di server (npm install -g pm2)
            pm2 describe api-whatsapp > /dev/null
            if [ $? -eq 0 ]; then
                pm2 restart api-whatsapp
            else
                pm2 start server.js --name "api-whatsapp"
            fi
            
            # 4. Simpan konfigurasi PM2 agar auto start jika server mati/restart
            pm2 save
